# Netlify configuration for The Latent Review.
# The site itself is a static Astro build; the only dynamic surface is the
# functions in netlify/functions (subscribe / confirm / unsubscribe).
# Secrets (Supabase service key, Resend key) live in Netlify environment
# variables — never in this repo (CLAUDE.md).

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # The AI review desk reads the editors' written criteria at runtime so the
  # criteria stay versioned in the repo (see docs/EDITORS-DESK.md).
  # The published archive ships too: the agent-direct door validates a
  # letter's declared piece target — existence and the two-month freshness
  # window — against these files, because the archive is markdown in the
  # repo and not a database table (slice c2, C2-2).
  included_files = ["docs/EDITORIAL-CRITERIA.md", "src/content/articles/**"]

# Astro emits the sitemap as /sitemap-index.xml, and robots.txt names that
# address, which is what every major crawler follows. Smaller tools probe the
# conventional /sitemap.xml blindly and get a 404. One redirect costs nothing
# and removes the guess.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Security response headers. Netlify ships none by default; these are
# defence-in-depth, and the CSP is a second line under the F2 XSS-class fix.
# The CSP is intentionally Report-Only first (per Netlify's guidance): it
# reports violations without blocking, so we can tighten from real data before
# enforcing. connect-src allows Supabase for the Editors' Desk client
# (admin.astro); style-src allows inline styles Astro emits.
#
# IT NOW HAS SOMEWHERE TO REPORT TO, WHICH IT DID NOT BEFORE. From PR #34 until
# 2026-07-29 the policy carried no reporting directive at all, which made
# Report-Only inert: browsers evaluated it, logged to each visitor's own
# console, and sent nothing anywhere, so the "tighten from real data" plan was
# waiting on data that could not arrive (security review C1).
#
# BOTH DIRECTIVES, DELIBERATELY. report-to is the Reporting API and is what
# Chromium implements; report-uri is deprecated and is what the other engines
# still implement. A policy carrying only one of them observes only part of the
# audience, and the part it would miss is the part most likely to break
# differently.
#
# STILL REPORT-ONLY, AND THE FLIP IS NOT SCHEDULED. Enforcing today would break
# the site: every script here is inlined by the build (dist/_astro holds no .js
# at all), so script-src 'self' would silently kill the subscribe form on every
# page and both of /submit's validation scripts. Enforcement follows an
# observation window reviewed by both editors, with inline scripts nonced or
# extracted according to what the reports show. Enforcing-and-broken is worse
# than Report-Only-and-honest.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Reporting-Endpoints = "csp-endpoint=\"https://thelatentreview.com/api/csp-report\""
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co; report-to csp-endpoint; report-uri /api/csp-report"
